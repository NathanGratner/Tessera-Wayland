[package]
name = "tessera-comp"
description = "Tessera tiling Wayland compositor"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tessera-config.workspace = true
tessera-cells.workspace = true
tessera-ipc.workspace = true
serde_json.workspace = true
rustix = { workspace = true, features = ["fs", "process"] }
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true

[dependencies.smithay]
workspace = true
# S1: nested. S7 adds the real-session backend: udev/DRM/GBM, libinput, libseat.
features = [
    "backend_winit",
    "renderer_gl",
    "desktop",
    "wayland_frontend",
    "backend_udev",
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_egl",
]

[lints]
workspace = true
